<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Üzenet adatlap</title></head>
<body>
<div layout:fragment="content">
<div class="container-fluid py-3">

    <h4>Üzenet adatlap</h4>

    <dl class="row">
        <dt class="col-sm-2">MQ Message ID</dt>
        <dd class="col-sm-10"><code th:text="${message.messageId}"></code></dd>

        <dt class="col-sm-2">Tartalom</dt>
        <dd class="col-sm-10"><pre class="border rounded p-2 bg-light" th:text="${message.content}"></pre></dd>

        <dt class="col-sm-2">Tulajdonságok</dt>
        <dd class="col-sm-10"><pre class="border rounded p-2 bg-light" th:text="${message.properties}"></pre></dd>
    </dl>

    <a class="btn btn-secondary" th:href="@{/}">Vissza a listához</a>
    <form class="d-inline" th:action="@{/messages/{id}/delete(id=${message.messageId})}" method="post"
          onsubmit="return confirm('Biztosan törlöd ezt az üzenetet?');">
        <button type="submit" class="btn btn-danger">Törlés</button>
    </form>

</div>
</div>
</body>
</html>
