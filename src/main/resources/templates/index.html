<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Kezdőlap</title></head>
<body>
<div layout:fragment="content">
<div class="container-fluid py-3">

    <div th:if="${loadSuccess}" class="alert alert-success" th:text="${loadSuccess}"></div>
    <div th:if="${loadError}" class="alert alert-danger" th:text="${loadError}"></div>

    <form th:action="@{/load}" th:object="${mqConnectionModel}" method="post" class="row g-2 align-items-end mb-4">

        <div class="col-md-3">
            <label class="form-label">Host</label>
            <input type="text" class="form-control" th:field="*{host}" required/>
        </div>
        <div class="col-md-2">
            <label class="form-label">Port</label>
            <input type="text" class="form-control" th:field="*{port}" required/>
        </div>
        <div class="col-md-2">
            <label class="form-label">Queue Manager</label>
            <input type="text" class="form-control" th:field="*{queueManager}" required/>
        </div>
        <div class="col-md-2">
            <label class="form-label">Channel</label>
            <input type="text" class="form-control" th:field="*{channel}" required/>
        </div>
        <div class="col-md-3">
            <label class="form-label">Queue</label>
            <input type="text" class="form-control" th:field="*{queue}" required/>
        </div>

        <div class="col-md-3">
            <label class="form-label">Felhasználó</label>
            <input type="text" class="form-control" th:field="*{user}"/>
        </div>
        <div class="col-md-3">
            <label class="form-label">Jelszó</label>
            <input type="password" class="form-control" th:field="*{password}"/>
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-primary">Betöltés</button>
        </div>

    </form>

    <div th:replace="~{fragments/messages-table :: table}"></div>

</div>
</div>

<script layout:fragment="scripts" th:inline="javascript">
    (function () {
        var input = document.getElementById('messageSearchInput');
        if (!input) {
            return;
        }
        var timer = null;
        input.addEventListener('input', function () {
            clearTimeout(timer);
            var term = input.value;
            timer = setTimeout(function () {
                var url = /*[[@{/messages/fragment}]]*/ '/messages/fragment'
                    + '?query=' + encodeURIComponent(term) + '&page=0';
                fetch(url)
                    .then(function (response) { return response.text(); })
                    .then(function (html) {
                        var container = document.getElementById('messagesTableContainer');
                        if (container) {
                            container.outerHTML = html.trim();
                        }
                    });
            }, 300);
        });
    })();
</script>
</body>
</html>
