                        <button id="messageSearchButton" class="btn btn-outline-secondary" type="button"
                                title="Keresés indítása" aria-label="Keresés indítása">🔍</button>
                    </div>
                    <button id="loadTestDataButton" class="btn btn-outline-secondary me-2 d-none" type="button">Teszt adatok betöltése</button>
                    <button id="purgeMessagesButton" class="btn btn-outline-danger" type="button"
                            title="Összes üzenet törlése" aria-label="Összes üzenet törlése">🗑</button>

    <script th:inline="javascript">
        (function () {
            var purgeButton = document.getElementById('purgeMessagesButton');
            if (!purgeButton) {
                return;
            }
            purgeButton.addEventListener('click', function () {
                if (!confirm('Biztosan törlöd az összes üzenetet?')) {
                    return;
                }
                fetch(/*[[@{/messages/purge}]]*/ '/messages/purge', {method: 'POST'})
                    .then(function () {
                        window.location.href = /*[[@{/}]]*/ '/';
                    });
            });
        })();
        (function () {
            var loadTestDataButton = document.getElementById('loadTestDataButton');
            if (!loadTestDataButton) {
                return;
            }
            loadTestDataButton.addEventListener('click', function () {
                loadTestDataButton.disabled = true;
                fetch(/*[[@{/test-data/load}]]*/ '/test-data/load', {method: 'POST'})
                    .then(function (response) {
                        return response.text().then(function (text) {
                            alert(text);
                        });
                    })
                    .catch(function () {
                        alert('Hiba történt a teszt adatok betöltése közben.');
                    })
                    .finally(function () {
                        loadTestDataButton.disabled = false;
                    });
            });
        })();
    </script>
